{{- /*
The CA-pull job is gated by the SAME switch as the issuer's caBundleSecretRef:
clusterIssuer.venafi.tpp.caBundleSecretRef.enabled. When that is on, this job
runs (weight 3) before the ClusterIssuer (weight 10) and populates the secret
the issuer references. caPullJob.enabled (default true) selects the SOURCE — set
it false to instead supply the secret via tppCABundle.create or out-of-band.
*/ -}}
{{- if and .Values.clusterIssuer.enabled .Values.clusterIssuer.venafi.tpp.caBundleSecretRef.enabled .Values.caPullJob.enabled }}
{{- if .Values.tppCABundle.create }}
{{- fail "The CA-pull job and tppCABundle.create both create the same caBundle secret — set caPullJob.enabled=false to use the PEM, or tppCABundle.create=false to pull." }}
{{- end }}
{{- if .Values.caPullJob.rbac.create }}
# Secret-writer RBAC for the CA-pull Job, scoped to the operand namespace only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-capull
  namespace: {{ .Values.namespaces.operand }}
  labels:
    {{- include "cert-manager-venafi.labels" . | nindent 4 }}
  annotations:
    # Wave -2, with the Namespaces: this RBAC is a prerequisite of the ca-pull Job, which now runs at
    # wave -1 alongside the trusted-CA ConfigMap. A Job cannot authenticate with a ServiceAccount that
    # arrives in a later wave.
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-capull
  namespace: {{ .Values.namespaces.operand }}
  labels:
    {{- include "cert-manager-venafi.labels" . | nindent 4 }}
  annotations:
    # Wave -2, with the Namespaces: this RBAC is a prerequisite of the ca-pull Job, which now runs at
    # wave -1 alongside the trusted-CA ConfigMap. A Job cannot authenticate with a ServiceAccount that
    # arrives in a later wave.
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-capull
  namespace: {{ .Values.namespaces.operand }}
  labels:
    {{- include "cert-manager-venafi.labels" . | nindent 4 }}
  annotations:
    # Wave -2, with the Namespaces: this RBAC is a prerequisite of the ca-pull Job, which now runs at
    # wave -1 alongside the trusted-CA ConfigMap. A Job cannot authenticate with a ServiceAccount that
    # arrives in a later wave.
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-capull
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-capull
    namespace: {{ .Values.namespaces.operand }}
---
{{- end }}
# Pulls the TPP endpoint chain, strips the leaf, and writes the intermediate+root
# into the caBundle secret. Weight 3 → after its RBAC (1), before the
# ClusterIssuer hook (10) so the secret exists if the issuer references it.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-capull
  namespace: {{ .Values.namespaces.operand }}
  labels:
    {{- include "cert-manager-venafi.labels" . | nindent 4 }}
  annotations:
    # WAVE -1 AND HELM WEIGHT -4 — THE SAME POSITION AS THE trusted-CA ConfigMap, deliberately. These two
    # are alternative ways to obtain the root CA, selected by a flag: pull it from the TPP endpoint with
    # this Job, or let OpenShift inject the cluster bundle into the labelled ConfigMap. Because they are
    # interchangeable they must occupy the SAME slot in the ordering — otherwise flipping the flag silently
    # moves when the CA becomes available, and whichever consumer needed it earlier starts failing.
    #
    # Both therefore land before the Subscription (wave 0), so the CA material exists before OLM starts the
    # operator. This Job talks to the TPP endpoint rather than to cert-manager, so it has nothing to wait
    # for; its only prerequisite is its own RBAC, moved to wave -2 above.
    argocd.argoproj.io/sync-wave: "-1"
    # WITHOUT AN ARGOCD HOOK ANNOTATION THIS IS AN ORDINARY RESOURCE TO ARGOCD, which does not read
    # helm.sh/hook at all. Argo would re-apply the Job on every sync, and a Job's spec.template is
    # IMMUTABLE — so the second sync fails with "field is immutable". BeforeHookCreation is what makes
    # that moot, by deleting the previous run before creating this one.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    "helm.sh/hook": post-install,post-upgrade
    # Weight -4: the same slot as the ConfigMap alternative, and immediately after the InstallPlan approver
    # (-5). An ordinary resource like the ConfigMap is applied before ANY hook, so -4 is as close to "the
    # same position" as a hook can be while still letting the approver go first.
    "helm.sh/hook-weight": "-4"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.caPullJob.backoffLimit }}
  activeDeadlineSeconds: {{ add .Values.caPullJob.timeoutSeconds 120 }}
  template:
    metadata:
      labels:
        {{- include "cert-manager-venafi.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- if .Values.caPullJob.rbac.create }}
      serviceAccountName: {{ .Release.Name }}-capull
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: work
          emptyDir:
            medium: Memory
      containers:
        - name: capull
          image: {{ .Values.caPullJob.image }}
          imagePullPolicy: {{ .Values.caPullJob.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.caPullJob.resources | nindent 12 }}
          volumeMounts:
            - name: work
              mountPath: /tmp
          env:
            - name: HOST
              value: {{ .Values.caPullJob.host | quote }}
            - name: PORT
              value: {{ .Values.caPullJob.port | quote }}
            - name: OPERAND_NS
              value: {{ .Values.namespaces.operand | quote }}
            - name: SECRET_NAME
              value: {{ .Values.tppCABundle.secretName | quote }}
            - name: SECRET_KEY
              value: {{ .Values.tppCABundle.key | quote }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              log() { echo "[capull $(date -u +%H:%M:%S)] $*"; }

              log "pulling chain from ${HOST}:${PORT} ..."
              openssl s_client -connect "${HOST}:${PORT}" -servername "${HOST}" -showcerts < /dev/null 2>/dev/null \
                | sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' > /tmp/full-chain.pem
              total=$(grep -c 'BEGIN CERTIFICATE' /tmp/full-chain.pem || echo 0)
              log "received ${total} cert(s) in the chain"
              [ "${total}" -ge 2 ] || { log "ERROR: expected >=2 certs (leaf + issuer(s)); the endpoint returned ${total}"; exit 1; }

              # Skip the first cert (leaf/server) — keep intermediate + root.
              awk '/-----BEGIN CERTIFICATE-----/ {n++} n >= 2 {print}' /tmp/full-chain.pem > /tmp/robocorp-bundle-cert.pem
              kept=$(grep -c 'BEGIN CERTIFICATE' /tmp/robocorp-bundle-cert.pem || echo 0)
              log "kept ${kept} CA cert(s) after stripping the leaf:"
              openssl crl2pkcs7 -nocrl -certfile /tmp/robocorp-bundle-cert.pem | openssl pkcs7 -print_certs -noout | sed 's/^/    /'
              [ -s /tmp/robocorp-bundle-cert.pem ] || { log "ERROR: empty CA bundle"; exit 1; }

              log "writing secret ${OPERAND_NS}/${SECRET_NAME} (key ${SECRET_KEY}) ..."
              # Server-side apply keeps the merge on the API server, avoiding the
              # client-side OpenAPI schema load that OOMKills a small container.
              oc create secret generic "${SECRET_NAME}" -n "${OPERAND_NS}" \
                --from-file="${SECRET_KEY}=/tmp/robocorp-bundle-cert.pem" \
                --dry-run=client -o yaml \
                | oc apply --server-side --force-conflicts --field-manager=capull-job -f -
              log "SUCCESS: caBundle secret populated from ${HOST}:${PORT}"
{{- end }}
