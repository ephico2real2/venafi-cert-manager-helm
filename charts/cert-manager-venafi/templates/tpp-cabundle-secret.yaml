{{- if .Values.tppCABundle.create }}
# TPP CA bundle (intermediate + root) used to verify the TPP endpoint's TLS
# chain. This is the certificate material — distinct from the auth credentials.
# Rendered only when tppCABundle.create=true (supply the PEM via
# tppCABundle.caBundle). Otherwise the secret is sourced by the CA-pull Job or
# pre-created out-of-band. See tpp-credentials-secret.yaml for the auth secret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.tppCABundle.secretName }}
  namespace: {{ .Values.namespaces.operand }}
  annotations:
    # Wave 1: after the Subscription and approver (0), before the Jobs that consume it (2 and 3).
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "cert-manager-venafi.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.tppCABundle.key }}: |
    {{- required "tppCABundle.caBundle is required when tppCABundle.create=true" .Values.tppCABundle.caBundle | nindent 4 }}
{{- end }}
