{{- if .Values.verifyJob.enabled }}
# Operator-readiness gate. Runs the OpenShift CLI to verify the operator is
# fully installed before the ClusterIssuer (weight 10) is created. Weight 5
# places it after the RBAC (weight 0) and before the issuer.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-verify-operator
  namespace: {{ .Values.namespaces.operator }}
  labels:
    {{- include "cert-manager-venafi.labels" . | nindent 4 }}
  annotations:
    # Wave 3: after the ca-pull Job (2), before the ClusterIssuer (4) that depends on everything this Job
    # waits for. Under plain Helm the weight does the ordering; under ArgoCD the wave does.
    argocd.argoproj.io/sync-wave: "3"
    # Same reason as the ca-pull Job: with no argocd hook annotation Argo treats this as an ordinary
    # resource and the second sync fails on the immutable spec.template. HookSucceeded keeps a FAILED
    # run's pod log, which for a five-stage readiness gate is the only place the reason lives.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.verifyJob.backoffLimit }}
  # Job-level guard so a wedged pod can't outlive the wait budget.
  activeDeadlineSeconds: {{ add .Values.verifyJob.timeoutSeconds 120 }}
  template:
    metadata:
      labels:
        {{- include "cert-manager-venafi.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- if .Values.verifyJob.rbac.create }}
      serviceAccountName: {{ .Release.Name }}-verify
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: work
          emptyDir:
            medium: Memory
      containers:
        - name: verify
          image: {{ .Values.verifyJob.image }}
          imagePullPolicy: {{ .Values.verifyJob.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.verifyJob.resources | nindent 12 }}
          volumeMounts:
            - name: work
              mountPath: /tmp
          env:
            # oc writes its discovery/OpenAPI cache here; /tmp is the writable
            # emptyDir since the root filesystem is read-only.
            - name: KUBECACHEDIR
              value: /tmp/.kube/cache
            - name: OPERATOR_NS
              value: {{ .Values.namespaces.operator | quote }}
            - name: OPERAND_NS
              value: {{ .Values.namespaces.operand | quote }}
            - name: SUBSCRIPTION
              value: {{ .Values.operator.packageName | quote }}
            - name: TIMEOUT
              value: {{ .Values.verifyJob.timeoutSeconds | quote }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              deadline=$(( $(date +%s) + TIMEOUT ))
              log() { echo "[verify $(date -u +%H:%M:%S)] $*"; }
              remaining() { local r=$(( deadline - $(date +%s) )); [ "$r" -lt "${1:-15}" ] && r="${1:-15}"; echo "$r"; }

              log "1/5 waiting for Subscription/${SUBSCRIPTION} installedCSV in ${OPERATOR_NS} ..."
              while :; do
                csv=$(oc get subscription "${SUBSCRIPTION}" -n "${OPERATOR_NS}" -o jsonpath='{.status.installedCSV}' 2>/dev/null || true)
                [ -n "${csv}" ] && break
                [ "$(date +%s)" -ge "${deadline}" ] && { log "TIMEOUT: no installedCSV on Subscription"; exit 1; }
                sleep 5
              done
              log "    installedCSV=${csv}"

              log "2/5 waiting for CSV/${csv} phase=Succeeded ..."
              while :; do
                phase=$(oc get csv "${csv}" -n "${OPERATOR_NS}" -o jsonpath='{.status.phase}' 2>/dev/null || true)
                log "    CSV phase=${phase:-<none>}"
                [ "${phase}" = "Succeeded" ] && break
                [ "${phase}" = "Failed" ] && { log "CSV reported Failed"; exit 1; }
                [ "$(date +%s)" -ge "${deadline}" ] && { log "TIMEOUT: CSV not Succeeded (phase=${phase})"; exit 1; }
                sleep 10
              done

              log "3/5 waiting for operand Deployments in ${OPERAND_NS} to be Available ..."
              while :; do
                count=$(oc get deploy -n "${OPERAND_NS}" -o name 2>/dev/null | wc -l | tr -d ' ')
                [ "${count}" -ge 3 ] && break
                [ "$(date +%s)" -ge "${deadline}" ] && { log "TIMEOUT: expected >=3 operand deployments, found ${count}"; exit 1; }
                sleep 5
              done
              oc wait --for=condition=Available --timeout="$(remaining 30)s" deployment --all -n "${OPERAND_NS}"

              log "4/5 waiting for cert-manager CRDs to be Established ..."
              for crd in clusterissuers.cert-manager.io certificates.cert-manager.io; do
                while :; do
                  oc get crd "${crd}" >/dev/null 2>&1 && break
                  [ "$(date +%s)" -ge "${deadline}" ] && { log "TIMEOUT: CRD ${crd} not present"; exit 1; }
                  sleep 5
                done
                oc wait --for=condition=Established --timeout="$(remaining 15)s" "crd/${crd}"
              done

              # "Deployment Available" is not "webhook serving admission": on a fresh
              # install the cainjector may not have wired the webhook CA yet, so a
              # ClusterIssuer create fails with an x509/"webhook.cert-manager.io"
              # error. Probe with a server-dry-run (nothing persisted) until the
              # validating webhook actually accepts a cert-manager resource.
              log "5/5 waiting for the cert-manager validating webhook to serve admission ..."
              PROBE='{"apiVersion":"cert-manager.io/v1","kind":"ClusterIssuer","metadata":{"name":"cmv-webhook-probe"},"spec":{"selfSigned":{}}}'
              while :; do
                if out=$(printf '%s' "${PROBE}" | oc create --dry-run=server -f - 2>&1); then
                  log "    webhook admission OK"
                  break
                fi
                log "    webhook not ready yet: $(printf '%s' "${out}" | tr '\n' ' ' | tail -c 140)"
                [ "$(date +%s)" -ge "${deadline}" ] && { log "TIMEOUT: webhook not serving admission"; exit 1; }
                sleep 5
              done

              log "SUCCESS: operator installed, operands Available, CRDs Established, webhook serving — ClusterIssuer may be created"
{{- end }}
