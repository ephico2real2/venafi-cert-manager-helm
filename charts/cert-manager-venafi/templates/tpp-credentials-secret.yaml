{{- if .Values.tppCredentials.create }}
# TPP authentication credentials. The AD service-account username/password
# cert-manager's Venafi issuer uses to authenticate to TPP — it requires the
# exact keys `username` and `password`.
# Uses `data` with pre-base64-encoded values (no `stringData`) because there is
# no secret-manager wiring — the operator supplies the values already encoded.
# When tppCredentials.create=false the chart does NOT render this; the secret
# named below must be pre-created as a prerequisite (see NOTES / README).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.tppCredentials.secretName }}
  namespace: {{ .Values.namespaces.operand }}
  labels:
    {{- include "cert-manager-venafi.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ required "tppCredentials.usernameBase64 is required when tppCredentials.create=true (provide a base64-encoded value)" .Values.tppCredentials.usernameBase64 }}
  password: {{ required "tppCredentials.passwordBase64 is required when tppCredentials.create=true (provide a base64-encoded value)" .Values.tppCredentials.passwordBase64 }}
{{- end }}
