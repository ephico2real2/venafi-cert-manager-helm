{{- if .Values.trustedCA.enabled }}
# Empty ConfigMap carrying the inject-trusted-cabundle label. OpenShift's
# network operator populates its `ca-bundle.crt` key with the cluster-wide
# trusted CA bundle. The operator Subscription points at this ConfigMap via
# TRUSTED_CA_CONFIGMAP_NAME so cert-manager trusts internal/enterprise CAs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.trustedCA.configMapName }}
  namespace: {{ .Values.namespaces.operand }}
  annotations:
    # WAVE -1, WITH THE OPERATORGROUP AND BEFORE THE SUBSCRIPTION — not wave 1, where an earlier version
    # of this change put it. The Subscription sets TRUSTED_CA_CONFIGMAP_NAME to this ConfigMap, so the
    # operator looks for it as soon as OLM starts it. In a later wave the operator starts first, does not
    # find it, and reports on every component:
    #   SyncError: (Retrying) trusted CA config map "trusted-ca" doesn't exist
    # Measured on this cluster: that condition stayed True for minutes AFTER the ConfigMap was recreated,
    # because the operator had not re-reconciled. Self-healing but noisy — and it makes the operator's own
    # Degraded signal untrustworthy exactly when a readiness gate wants to read it.
    #
    # This ConfigMap has no dependencies of its own: OpenShift's network operator fills ca-bundle.crt from
    # the label below. So there is no reason for it to wait for anything.
    argocd.argoproj.io/sync-wave: "-1"
    # The operator writes data.ca-bundle.crt here; the chart deliberately ships it empty.
    # Server-side apply lets the operator keep ownership of what it wrote instead of Argo
    # reverting it on every sync — which would empty the bundle and make every external
    # cluster unreachable until the operator refilled it.
    #
    # NOT sufficient on its own: the Application also needs an ignoreDifferences entry for
    # this ConfigMap's `data`. That cannot be set from here — see the chart README.
    argocd.argoproj.io/sync-options: ServerSideApply=true
  labels:
    config.openshift.io/inject-trusted-cabundle: "true"
    {{- include "cert-manager-venafi.labels" . | nindent 4 }}
{{- end }}
