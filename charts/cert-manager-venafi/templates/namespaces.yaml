    argocd.argoproj.io/sync-wave: "-2"
    {{- if .Values.namespaces.protectOnUninstall }}
    # KEEP ON UNINSTALL. This chart CREATES these namespaces, so without this `helm uninstall` deletes them
    # — and a namespace deletion takes everything inside it, including resources this chart never made.
    # Measured on a live cluster: the operand namespace held the root CA Secret of an unrelated LDAP TLS
    # chain (ldap-enterprise-root-ca), the TPP credentials Secret, and the webhook CA. Deleting the
    # namespace to remove a Subscription would have broken LDAPS for a service that had nothing to do with
