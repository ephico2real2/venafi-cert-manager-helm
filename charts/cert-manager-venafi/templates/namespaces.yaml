{{- if .Values.namespaces.create }}
# The operator namespace opts into OpenShift cluster monitoring so the
# operator's metrics are scraped by the platform Prometheus.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.operator }}
  annotations:
    # Wave -2: before the OperatorGroup (-1) and the Subscription (0), because everything else lives in
    # these namespaces. Deliberately NOT a Helm hook: Helm CREATES hook resources rather than applying
    # them and never records them in the release, so a hooked namespace survives `helm uninstall`
    # untracked and never has its labels reconciled on upgrade.
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    kubernetes.io/metadata.name: {{ .Values.namespaces.operator }}
    openshift.io/cluster-monitoring: "true"
    {{- include "cert-manager-venafi.labels" . | nindent 4 }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.operand }}
  annotations:
    # Wave -2: before the OperatorGroup (-1) and the Subscription (0), because everything else lives in
    # these namespaces. Deliberately NOT a Helm hook: Helm CREATES hook resources rather than applying
    # them and never records them in the release, so a hooked namespace survives `helm uninstall`
    # untracked and never has its labels reconciled on upgrade.
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    kubernetes.io/metadata.name: {{ .Values.namespaces.operand }}
    {{- include "cert-manager-venafi.labels" . | nindent 4 }}
{{- end }}
