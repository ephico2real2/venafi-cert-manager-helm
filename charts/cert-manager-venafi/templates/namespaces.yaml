{{- if .Values.namespaces.create }}
# The operator namespace opts into OpenShift cluster monitoring so the
# operator's metrics are scraped by the platform Prometheus.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.operator }}
  annotations:
    # Wave -2: before the OperatorGroup (-1) and the Subscription (0), because everything else lives in
    # these namespaces. Deliberately NOT a Helm hook: Helm CREATES hook resources rather than applying
    # them and never records them in the release, so a hooked namespace survives `helm uninstall`
    # untracked and never has its labels reconciled on upgrade.
    argocd.argoproj.io/sync-wave: "-2"
    {{- if .Values.namespaces.protectOnUninstall }}
    # KEEP ON UNINSTALL. This chart CREATES these namespaces, so without this `helm uninstall` deletes them
    # — and a namespace deletion takes everything inside it, including resources this chart never made.
    # Measured on a live cluster: the operand namespace held the root CA Secret of an unrelated LDAP TLS
    # chain (ldap-enterprise-root-ca), the TPP credentials Secret, and the webhook CA. Deleting the
    # namespace to remove a Subscription would have broken LDAPS for a service that had nothing to do with
    # this release.
    #
    # Helm reads this from the STORED RELEASE MANIFEST, not from the live object, so annotating a namespace
    # by hand after the fact does nothing — it has to be here and be stored by an upgrade.
    #
    # The namespaces are left behind on uninstall, which is the safe direction: an empty namespace costs
    # nothing and `oc delete ns` is one deliberate command away.
    helm.sh/resource-policy: keep
    {{- end }}
  labels:
    kubernetes.io/metadata.name: {{ .Values.namespaces.operator }}
    openshift.io/cluster-monitoring: "true"
    {{- include "cert-manager-venafi.labels" . | nindent 4 }}
---
