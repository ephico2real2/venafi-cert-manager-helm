{{- if and .Values.verifyJob.enabled .Values.verifyJob.rbac.create }}
# Read-only RBAC for the operator-readiness verification Job. Created as an
# early-weight hook so it exists before the Job (weight 5) runs, and persists
# across upgrades (before-hook-creation recreates it idempotently).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-verify
  namespace: {{ .Values.namespaces.operator }}
  labels:
    {{- include "cert-manager-venafi.labels" . | nindent 4 }}
  annotations:
    # Wave 1, and ORDINARY RESOURCES rather than hooks. Helm CREATES hook resources instead of applying
    # them and never records them in the release, so hooked RBAC survives `helm uninstall`, is never
    # reconciled on upgrade, and accumulates. Ordinary resources are also applied before any hook runs,
    # which is precisely the ordering a hook Job needs from its own ServiceAccount.
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-verify
  labels:
    {{- include "cert-manager-venafi.labels" . | nindent 4 }}
  annotations:
    # Wave 1, and ORDINARY RESOURCES rather than hooks. Helm CREATES hook resources instead of applying
    # them and never records them in the release, so hooked RBAC survives `helm uninstall`, is never
    # reconciled on upgrade, and accumulates. Ordinary resources are also applied before any hook runs,
    # which is precisely the ordering a hook Job needs from its own ServiceAccount.
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: ["operators.coreos.com"]
    resources: ["subscriptions", "clusterserviceversions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  # `create` (used only with --dry-run=server) lets the Job probe that the
  # cert-manager validating webhook is actually serving admission before the
  # real ClusterIssuer is created. Nothing is persisted by the dry run.
  - apiGroups: ["cert-manager.io"]
    resources: ["clusterissuers"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-verify
  labels:
    {{- include "cert-manager-venafi.labels" . | nindent 4 }}
  annotations:
    # Wave 1, and ORDINARY RESOURCES rather than hooks. Helm CREATES hook resources instead of applying
    # them and never records them in the release, so hooked RBAC survives `helm uninstall`, is never
    # reconciled on upgrade, and accumulates. Ordinary resources are also applied before any hook runs,
    # which is precisely the ordering a hook Job needs from its own ServiceAccount.
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-verify
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-verify
    namespace: {{ .Values.namespaces.operator }}
{{- end }}
